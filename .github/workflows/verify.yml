name: Verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m compileall -q scripts plugins/not-ai/tools
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_checks.py
      - run: python scripts/verify_measure.py
      - run: python scripts/sync_skill.py --check
      - run: python scripts/scan_prose.py
      - run: python scripts/benchmark.py --dry-run
